# mock1.brunopessoa.com serves /mock1/, mock2.brunopessoa.com serves /mock2/; any other host
# lands on the picker. Assets use absolute paths (/shared/, /mock1/, /mock2/) so one image
# serves every host.
map $host $lm_mock {
    default "";
    ~^mock1\. mock1;
    ~^mock2\. mock2;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    add_header Cache-Control "no-cache" always;
    location = / {
        try_files /$lm_mock/index.html /index.html;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
