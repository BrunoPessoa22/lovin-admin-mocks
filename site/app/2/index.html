<!doctype html>
<html lang="en-MT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lovin Malta app · Mock 2 · HeroUI Native</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/frame.css">
<style>
  :root { --app-bg: #F4F4F5; --status-fg: #18181B; --bg: #F4F4F5; --surface: #fff; --surface2: #F1F1F3; --fg: #18181B; --muted: #71717A; --default: #ECECEE; --separator: #E4E4E7; --accent: #E4162B; --accent-soft: rgba(228,22,43,.13); --accent-soft-fg: #B0142A; --success: #17C964; --success-soft: rgba(23,201,100,.16); --success-fg: #0E7A3D; --warning-soft: rgba(245,165,36,.18); --warning-fg: #8A5A00; --shadow: 0 2px 4px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.06), 0 0 1px rgba(0,0,0,.06); --glass: rgba(255,255,255,.72); --glass-line: rgba(255,255,255,.8); --sea: #DCE7F0; --land: #F6F3EA; --road: #fff; }
  @media (prefers-color-scheme: dark) { :root { --app-bg: #0A0A0B; --status-fg: #fff; --bg: #0A0A0B; --surface: #18181B; --surface2: #202024; --fg: #FAFAFA; --muted: #A1A1AA; --default: #27272A; --separator: #2A2A2E; --accent: #F0435A; --accent-soft: rgba(240,67,90,.16); --accent-soft-fg: #FF8A96; --success-soft: rgba(23,201,100,.16); --success-fg: #4ADE80; --warning-soft: rgba(245,165,36,.16); --warning-fg: #FBBF24; --shadow: none; --glass: rgba(24,24,27,.72); --glass-line: rgba(255,255,255,.1); --sea: #12202B; --land: #26262A; --road: #34343A; } }
  .app { font-family: Inter, -apple-system, system-ui, sans-serif; color: var(--fg); -webkit-font-smoothing: antialiased; }
  main { position: absolute; inset: 0; }
  [data-screen] { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: 54px 0 120px; scrollbar-width: none; }
  [data-screen]::-webkit-scrollbar { display: none; }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 10px; }
  .top h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
  .top .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .ibtn { width: 40px; height: 40px; border-radius: 20px; background: var(--default); display: inline-flex; align-items: center; justify-content: center; color: var(--fg); border: 0; }
  .ibtn i { width: 18px; height: 18px; }
  .search { margin: 0 20px 12px; height: 44px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; padding: 0 16px; color: var(--muted); font-size: 15px; }
  .search i { width: 16px; height: 16px; }
  .tabs { margin: 0 20px 14px; display: inline-flex; padding: 4px; border-radius: 22px; background: var(--default); }
  .tabs button { height: 34px; padding: 0 14px; border: 0; border-radius: 17px; background: transparent; color: var(--muted); font: 500 13px Inter, system-ui; white-space: nowrap; }
  .tabs button[data-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
  .tabs-wrap { overflow-x: auto; scrollbar-width: none; }
  .card { margin: 0 20px 12px; background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); padding: 16px; }
  .card.flush { padding: 0; overflow: hidden; }
  .card h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  .chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12px; font-weight: 500; background: var(--default); color: var(--fg); white-space: nowrap; }
  .chip.accent { background: var(--accent-soft); color: var(--accent-soft-fg); } .chip.success { background: var(--success-soft); color: var(--success-fg); } .chip.warning { background: var(--warning-soft); color: var(--warning-fg); }
  .chip i { width: 12px; height: 12px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 18px; border-radius: 22px; border: 0; font: 500 15px Inter, system-ui; }
  .btn.primary { background: var(--accent); color: #fff; } .btn.secondary { background: var(--default); color: var(--fg); } .btn.sm { height: 36px; padding: 0 14px; font-size: 13px; }
  .btn i { width: 16px; height: 16px; }
  .section { display: flex; align-items: center; justify-content: space-between; padding: 6px 20px 10px; }
  .section h2 { margin: 0; font-size: 17px; font-weight: 600; } .section a { color: var(--accent-soft-fg); font-size: 13px; font-weight: 500; text-decoration: none; }
  /* news */
  .hero { margin: 0 20px 12px; border-radius: 24px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
  .hero img { width: 100%; height: 190px; object-fit: cover; display: block; }
  .hero .b { padding: 14px 16px 16px; }
  .hero .h { font-size: 19px; font-weight: 600; line-height: 1.25; margin-top: 8px; letter-spacing: -.3px; }
  .hero .dek { font-size: 14px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
  .nrow { display: flex; gap: 12px; align-items: center; padding: 12px 16px; }
  .nrow + .nrow { border-top: 1px solid var(--separator); }
  .nrow img { width: 72px; height: 72px; border-radius: 16px; object-fit: cover; background: var(--default); flex: none; }
  .nrow .h { font-size: 15px; font-weight: 600; line-height: 1.3; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  /* live */
  [data-screen="live"] { padding: 0; overflow: hidden; background: var(--sea); }
  .map { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map .sea { fill: var(--sea); } .map .land { fill: var(--land); } .map .roads { stroke: var(--road); } .map .labels text { fill: var(--muted); font-family: Inter, system-ui; font-weight: 600; }
  .pin .pin-halo { fill: var(--accent); opacity: .2; } .pin .pin-dot { fill: var(--accent); stroke: #fff; stroke-width: .8; }
  .pin[data-kind="traffic"] .pin-dot, .pin[data-kind="traffic"] .pin-halo { fill: #F5A524; } .pin[data-kind="sea"] .pin-dot, .pin[data-kind="sea"] .pin-halo { fill: #006FEE; }
  .live-top { position: absolute; top: 62px; left: 20px; right: 20px; display: flex; gap: 8px; align-items: center; z-index: 3; }
  .pill { height: 44px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; font-weight: 600; font-size: 15px; }
  .pill .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--success); }
  .pill.ic { width: 44px; padding: 0; justify-content: center; }
  .pill i { width: 18px; height: 18px; }
  .live-side { position: absolute; right: 20px; top: 118px; display: flex; flex-direction: column; gap: 8px; z-index: 3; }
  .live-card { position: absolute; left: 16px; right: 16px; bottom: 100px; z-index: 3; margin: 0; }
  .now { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 10px; padding: 0 16px; }
  .now div { flex: none; background: var(--surface2); border-radius: 16px; padding: 8px 12px; font-size: 12px; color: var(--muted); }
  .now b { display: block; font-size: 18px; font-weight: 600; color: var(--fg); }
  .rep { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--separator); }
  .rep .av { width: 36px; height: 36px; border-radius: 18px; background: var(--accent-soft); color: var(--accent-soft-fg); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .rep .av i { width: 16px; height: 16px; }
  .rep .t { font-size: 14px; font-weight: 600; } .rep .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .fab { position: absolute; right: 20px; bottom: 100px; z-index: 4; box-shadow: 0 8px 24px rgba(228,22,43,.3); }
  /* what's on */
  .days { display: flex; gap: 8px; padding: 0 20px 14px; overflow-x: auto; scrollbar-width: none; }
  .day { flex: none; width: 54px; padding: 10px 0; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); text-align: center; font-size: 11px; color: var(--muted); font-weight: 500; }
  .day b { display: block; font-size: 18px; color: var(--fg); font-weight: 600; margin-top: 2px; }
  .day[data-selected="true"] { background: var(--accent); color: rgba(255,255,255,.8); } .day[data-selected="true"] b { color: #fff; }
  .ev { display: flex; gap: 12px; align-items: center; padding: 12px 16px; }
  .ev + .ev { border-top: 1px solid var(--separator); }
  .ev img { width: 60px; height: 60px; border-radius: 16px; object-fit: cover; background: var(--default); flex: none; }
  .ev .t { font-size: 15px; font-weight: 600; } .ev .s { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .ev .when { flex: none; text-align: center; background: var(--accent-soft); color: var(--accent-soft-fg); border-radius: 14px; padding: 6px 10px; font-size: 11px; font-weight: 600; line-height: 1.2; }
  .ev .when b { display: block; font-size: 16px; }
  /* ejja */
  .chat { padding: 4px 20px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 80%; padding: 12px 14px; border-radius: 22px; font-size: 15px; line-height: 1.4; box-shadow: var(--shadow); }
  .msg.ejja { align-self: flex-start; background: var(--surface); border-bottom-left-radius: 8px; }
  .msg.me { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 8px; box-shadow: none; }
  .msg .at { display: block; font-size: 11px; opacity: .55; margin-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 0 6px; }
  .chips button { height: 34px; padding: 0 14px; border-radius: 17px; border: 0; background: var(--accent-soft); color: var(--accent-soft-fg); font: 500 13px Inter, system-ui; }
  .composer { position: absolute; left: 16px; right: 16px; bottom: 100px; height: 52px; border-radius: 26px; background: var(--surface); box-shadow: 0 8px 24px rgba(0,0,0,.12); display: flex; align-items: center; gap: 8px; padding: 0 6px 0 16px; z-index: 4; }
  .composer .field { flex: 1; font-size: 15px; color: var(--muted); }
  .composer .send { width: 40px; height: 40px; border-radius: 20px; background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
  .composer i { width: 18px; height: 18px; }
  .ejja-card { margin: 0 20px 12px; display: flex; align-items: center; gap: 12px; }
  .ejja-card .av { width: 48px; height: 48px; border-radius: 24px; background: var(--accent-soft); color: var(--accent-soft-fg); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  /* you */
  .me { text-align: center; padding: 20px 16px 16px; }
  .me .av { width: 84px; height: 84px; border-radius: 42px; background: var(--accent-soft); color: var(--accent-soft-fg); font-size: 28px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 10px; }
  .me .n { font-size: 20px; font-weight: 600; letter-spacing: -.3px; } .me .s { font-size: 13px; color: var(--muted); margin: 4px 0 10px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 20px 12px; }
  .stat { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 14px 10px; text-align: center; font-size: 12px; color: var(--muted); }
  .stat b { display: block; font-size: 22px; font-weight: 600; color: var(--fg); letter-spacing: -.4px; }
  .badges { display: flex; gap: 8px; padding: 0 20px 12px; overflow-x: auto; scrollbar-width: none; }
  .srow { display: flex; align-items: center; gap: 12px; padding: 13px 16px; }
  .srow + .srow { border-top: 1px solid var(--separator); }
  .srow .ic { width: 36px; height: 36px; border-radius: 18px; background: var(--default); display: inline-flex; align-items: center; justify-content: center; color: var(--fg); flex: none; }
  .srow .ic i { width: 16px; height: 16px; }
  .srow .t { flex: 1; font-size: 15px; font-weight: 500; } .srow .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .srow .chev { width: 16px; height: 16px; color: var(--muted); }
  .switch { width: 44px; height: 26px; border-radius: 13px; background: var(--accent); position: relative; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 10px; background: #fff; }
  /* native tab bar (system Liquid Glass) */
  .tabbar { position: absolute; left: 14px; right: 14px; bottom: 26px; height: 66px; border-radius: 33px; z-index: 10; display: flex; align-items: center; padding: 6px; backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); background: var(--glass); border: 1px solid var(--glass-line); box-shadow: 0 6px 20px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.5); }
  .tabbar a { flex: 1; height: 54px; border-radius: 27px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); text-decoration: none; font-size: 10px; font-weight: 600; }
  .tabbar a i { width: 24px; height: 24px; }
  .tabbar a[data-selected="true"] { color: var(--accent); background: color-mix(in srgb, var(--fg) 7%, transparent); }
  @media (max-width: 520px) { .tabbar { bottom: 18px; } .fab, .live-card, .composer { bottom: 92px; } }
  /* sheet */
  #sheet { position: absolute; inset: 0; z-index: 40; }
  #sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.4); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 78%; background: var(--bg); border-radius: 32px 32px 0 0; padding: 10px 20px 20px; overflow-y: auto; }
  .sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--default); margin: 0 auto 14px; }
  .sheet h2 { margin: 0 0 12px; font-size: 20px; font-weight: 600; }
  .kinds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .kinds button { height: 72px; border: 0; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); color: var(--fg); font: 500 12px Inter, system-ui; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .kinds button i { width: 22px; height: 22px; color: var(--accent); }
  .kinds button[data-selected="true"] { background: var(--accent); color: #fff; } .kinds button[data-selected="true"] i { color: #fff; }
  .field { background: var(--default); border-radius: 16px; padding: 13px 16px; font-size: 15px; color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .field.area { min-height: 96px; align-items: flex-start; }
  .field i { width: 16px; height: 16px; color: var(--accent); }
  .sheet .btn { width: 100%; margin-top: 6px; }
</style>
</head>
<body>
<div class="phone"><div class="app">
  <div class="statusbar"><span>9:41</span><span class="sb-right"><i data-lucide="signal"></i><i data-lucide="wifi"></i><span class="bat"></span></span></div>
  <main id="main"></main>
  <nav class="tabbar" aria-label="Tabs">
    <a href="#live" data-tab="live"><i data-lucide="radio"></i>Live</a>
    <a href="#news" data-tab="news"><i data-lucide="newspaper"></i>News</a>
    <a href="#whatson" data-tab="whatson"><i data-lucide="calendar-days"></i>What's on</a>
    <a href="#ejja" data-tab="ejja"><i data-lucide="message-circle"></i>Ejja</a>
    <a href="#you" data-tab="you"><i data-lucide="user-round"></i>You</a>
  </nav>
  <div id="sheet" hidden><div id="sheet-backdrop"></div><div class="sheet"><div class="grab"></div><h2>New report</h2>
    <div class="kinds"><button type="button" data-seg data-selected="true"><i data-lucide="zap"></i>Power</button><button type="button" data-seg><i data-lucide="traffic-cone"></i>Traffic</button><button type="button" data-seg><i data-lucide="waves"></i>Water</button><button type="button" data-seg><i data-lucide="fish"></i>Sea</button><button type="button" data-seg><i data-lucide="siren"></i>Incident</button><button type="button" data-seg><i data-lucide="paw-print"></i>Animal</button><button type="button" data-seg><i data-lucide="volume-2"></i>Noise</button><button type="button" data-seg><i data-lucide="more-horizontal"></i>Other</button></div>
    <div class="field"><i data-lucide="map-pin"></i>Tower Road, Sliema (your location)</div>
    <div class="field area">What is happening? Keep it factual, no names.</div>
    <div class="field"><i data-lucide="camera"></i>Add a photo</div>
    <button type="button" class="btn primary" data-close-sheet>Send report</button><button type="button" class="btn secondary" style="width:100%;margin-top:8px" data-close-sheet>Cancel</button>
  </div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<script src="/app/data.js"></script><script src="/app/map.js"></script><script src="/app/base.js"></script>
<script>
(function () {
  var D = window.LMA, esc = window.LMBase.esc, ic = function (n) { return '<i data-lucide="' + n + '"></i>'; };
  function live() {
    return '<section data-screen="live">' + window.LMMap({ portrait: true }) +
      '<div class="live-top"><span class="pill" style="flex:1"><span class="dot"></span>Live in Malta<span class="chip accent" style="margin-left:auto">' + D.now.reports + ' today</span></span><button type="button" class="pill ic" aria-label="Layers">' + ic('layers') + '</button></div>' +
      '<div class="live-side"><button type="button" class="pill ic" aria-label="Locate">' + ic('locate') + '</button><button type="button" class="pill ic" aria-label="Alerts">' + ic('bell') + '</button></div>' +
      '<div class="card live-card"><div class="now"><div><b>' + D.now.temp + '</b>Sliema now</div><div><b>' + D.now.sea + '</b>sea</div><div><b>' + D.now.sunset + '</b>sunset</div><div><b>' + D.now.people.toLocaleString('en-MT') + '</b>on WhatsApp</div></div>' +
      D.reports.slice(0, 3).map(function (r) { return '<div class="rep"><span class="av">' + ic(r.icon) + '</span><div style="flex:1;min-width:0"><div class="t">' + esc(r.title) + '</div><div class="s">' + esc(r.locality) + ' · ' + esc(r.age) + '</div></div><span class="chip ' + (r.count > 2 ? 'success' : '') + '">' + ic('users') + r.count + '</span></div>'; }).join('') + '</div>' +
      '<button type="button" class="btn primary fab" data-open-sheet>' + ic('plus') + 'Report</button></section>';
  }
  function news() {
    var h = D.news[0];
    return '<section data-screen="news"><div class="top"><div><h1>News</h1><div class="sub">Malta and Gozo, newest first</div></div><button type="button" class="ibtn" aria-label="Saved">' + ic('bookmark') + '</button></div><div class="search">' + ic('search') + 'Search stories</div>' +
      '<div class="tabs-wrap"><div class="tabs"><button type="button" data-seg data-selected="true">Latest</button><button type="button" data-seg>Local</button><button type="button" data-seg>Food</button><button type="button" data-seg>Gozo</button><button type="button" data-seg>Sport</button></div></div>' +
      '<div class="hero"><img src="' + D.img(h.img, 780, 400) + '" alt=""><div class="b"><span class="chip accent">' + esc(h.section) + '</span> <span class="chip">' + esc(h.age) + '</span><div class="h">' + esc(h.title) + '</div><div class="dek">' + esc(h.dek) + '</div></div></div>' +
      '<div class="card flush">' + D.news.slice(1).map(function (n) { return '<div class="nrow"><img src="' + D.img(n.img, 240, 240) + '" alt=""><div style="flex:1;min-width:0"><div class="h">' + esc(n.title) + '</div><div class="meta"><span class="chip">' + esc(n.section) + '</span>' + esc(n.age) + '</div></div></div>'; }).join('') + '</div></section>';
  }
  function whatson() {
    var days = [['Mon', 7], ['Tue', 8], ['Wed', 9], ['Thu', 10], ['Fri', 11], ['Sat', 12], ['Sun', 13]];
    return '<section data-screen="whatson"><div class="top"><div><h1>What\'s on</h1><div class="sub">This week across Malta and Gozo</div></div><button type="button" class="ibtn" aria-label="Filters">' + ic('sliders-horizontal') + '</button></div>' +
      '<div class="tabs-wrap"><div class="tabs"><button type="button" data-seg data-selected="true">All</button><button type="button" data-seg>Music</button><button type="button" data-seg>Food and drink</button><button type="button" data-seg>Outdoors</button><button type="button" data-seg>Free</button></div></div>' +
      '<div class="days">' + days.map(function (d, i) { return '<div class="day" data-chip ' + (i === 4 ? 'data-selected="true"' : '') + '>' + d[0] + '<b>' + d[1] + '</b></div>'; }).join('') + '</div>' +
      '<div class="hero"><img src="' + D.img(D.events[0].img, 780, 400) + '" alt=""><div class="b"><span class="chip accent">Featured</span> <span class="chip">' + esc(D.events[0].day) + ' ' + esc(D.events[0].date) + '</span><div class="h">' + esc(D.events[0].title) + '</div><div class="dek">' + esc(D.events[0].venue) + ' · from ' + esc(D.events[0].time) + '</div><div style="margin-top:12px;display:flex;gap:8px"><button type="button" class="btn primary sm">' + ic('bookmark') + 'Save</button><button type="button" class="btn secondary sm">' + ic('share') + 'Share</button></div></div></div>' +
      '<div class="section"><h2>Friday to Sunday</h2><a href="#">See all</a></div><div class="card flush">' + D.events.slice(1).map(function (e) { return '<div class="ev"><div class="when">' + esc(e.day) + '<b>' + e.date.split(' ')[0] + '</b></div><div style="flex:1;min-width:0"><div class="t">' + esc(e.title) + '</div><div class="s">' + esc(e.venue) + ' · ' + esc(e.time) + '</div></div><img src="' + D.img(e.img, 200, 200) + '" alt=""></div>'; }).join('') + '</div></section>';
  }
  function ejja() {
    return '<section data-screen="ejja"><div class="top"><div><h1>Ejja</h1><div class="sub">Knows Malta right now</div></div><button type="button" class="ibtn" aria-label="History">' + ic('history') + '</button></div>' +
      '<div class="card ejja-card"><span class="av">E</span><div style="flex:1"><div style="font-weight:600;font-size:15px">Ejja is online</div><div style="font-size:12px;color:var(--muted)">298 answers today · alerts 08:00 to 22:00</div></div><span class="chip success">' + ic('check') + 'live</span></div>' +
      '<div class="chat">' + D.chat.map(function (m) { return '<div class="msg ' + m.from + '">' + esc(m.text) + '<span class="at">' + m.at + '</span></div>' + (m.chips ? '<div class="chips">' + m.chips.map(function (c) { return '<button type="button">' + esc(c) + '</button>'; }).join('') + '</div>' : ''); }).join('') + '</div>' +
      '<div class="composer"><span class="field">Ask Ejja anything about Malta</span><span class="send">' + ic('arrow-up') + '</span></div></section>';
  }
  function you() {
    var p = D.profile;
    return '<section data-screen="you"><div class="top"><div><h1>You</h1></div><button type="button" class="ibtn" aria-label="Settings">' + ic('settings') + '</button></div>' +
      '<div class="card me"><span class="av">' + p.initials + '</span><div class="n">' + esc(p.name) + '</div><div class="s">' + esc(p.locality) + '</div><span class="chip success">' + ic('shield-check') + esc(p.trust) + '</span></div>' +
      '<div class="stats"><div class="stat"><b>' + p.points + '</b>points</div><div class="stat"><b>' + p.reports + '</b>reports</div><div class="stat"><b>#' + p.rank + '</b>this month</div></div>' +
      '<div class="section"><h2>Badges</h2><a href="#">All ' + p.badges.length + '</a></div><div class="badges">' + p.badges.map(function (b) { return '<span class="chip accent" style="height:32px;padding:0 12px;font-size:13px">' + ic('award') + esc(b) + '</span>'; }).join('') + '</div>' +
      '<div class="section"><h2>Alerts</h2></div><div class="card flush"><div class="srow"><span class="ic">' + ic('bell') + '</span><div style="flex:1"><div class="t">Locality alerts</div><div class="s">' + esc(p.alerts.join(', ')) + '</div></div><span class="switch"></span></div><div class="srow"><span class="ic">' + ic('bell-ring') + '</span><div style="flex:1"><div class="t">Quiet hours</div><div class="s">22:00 to 08:00</div></div><span class="switch"></span></div></div>' +
      '<div class="section"><h2>Settings</h2></div><div class="card flush">' + D.settings.slice(2).map(function (s) { return '<div class="srow"><span class="ic">' + ic(s[2]) + '</span><div style="flex:1"><div class="t">' + esc(s[0]) + '</div><div class="s">' + esc(s[1]) + '</div></div><i data-lucide="chevron-right" class="chev"></i></div>'; }).join('') + '</div></section>';
  }
  window.LMBase.boot(function () { document.getElementById('main').innerHTML = live() + news() + whatson() + ejja() + you(); });
})();
</script>
