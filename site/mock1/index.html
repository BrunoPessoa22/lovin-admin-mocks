<style type="text/tailwindcss">
  @custom-variant dark (&:where(.dark, .dark *));
  @theme inline {
    --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --color-page: var(--page);
    --color-foreground: var(--foreground);
    --color-foreground-inverse: var(--foreground-inverse);
    --color-border: var(--border);
    --color-line-3: var(--border-line-3);
    --color-layer: var(--layer);
    --color-layer-line: var(--layer-line);
    --color-layer-foreground: var(--layer-foreground);
    --color-layer-hover: var(--layer-hover);
    --color-layer-focus: var(--layer-focus);
    --color-surface: var(--surface);
    --color-surface-hover: var(--surface-hover);
    --color-muted: var(--muted);
    --color-muted-hover: var(--muted-hover);
    --color-muted-foreground: var(--muted-foreground);
    --color-muted-foreground-1: var(--muted-foreground-1);
    --color-muted-foreground-2: var(--muted-foreground-2);
    --color-table-line: var(--table-line);
    --color-primary: var(--primary);
    --color-primary-hover: var(--primary-hover);
    --color-primary-focus: var(--primary-focus);
    --color-primary-foreground: var(--primary-foreground);
    --color-primary-50: var(--primary-50);
    --color-primary-100: var(--primary-100);
    --color-primary-200: var(--primary-200);
    --color-primary-400: var(--primary-400);
    --color-primary-500: var(--primary-500);
    --color-primary-600: var(--primary-600);
    --color-primary-700: var(--primary-700);
    --color-primary-800: var(--primary-800);
  }
</style>
<style>
  /* Preline semantic tokens, light. The values are Preline's own defaults (gray + blue scale). */
  :root {
    --page: #f9fafb;
    --foreground: #1f2937;
    --foreground-inverse: #ffffff;
    --border: #e5e7eb;
    --border-line-3: #d1d5db;
    --layer: #ffffff;
    --layer-line: #e5e7eb;
    --layer-foreground: #1f2937;
    --layer-hover: #f9fafb;
    --layer-focus: #f9fafb;
    --surface: #f3f4f6;
    --surface-hover: #e5e7eb;
    --muted: #f9fafb;
    --muted-hover: #f3f4f6;
    --muted-foreground: #9ca3af;
    --muted-foreground-1: #6b7280;
    --muted-foreground-2: #4b5563;
    --table-line: #e5e7eb;
    --primary-50: #eff6ff; --primary-100: #dbeafe; --primary-200: #bfdbfe; --primary-400: #60a5fa; --primary-500: #3b82f6;
    --primary-600: #2563eb; --primary-700: #1d4ed8; --primary-800: #1e40af;
    --primary: var(--primary-600);
    --primary-hover: var(--primary-700);
    --primary-focus: var(--primary-700);
    --primary-foreground: #ffffff;
    color-scheme: light;
  }
  /* Preline dark: the neutral scale, cards one step lighter than the page. */
  .dark {
    --page: #171717;
    --foreground: #e5e5e5;
    --foreground-inverse: #171717;
    --border: #404040;
    --border-line-3: #525252;
    --layer: #262626;
    --layer-line: #404040;
    --layer-foreground: #ffffff;
    --layer-hover: #404040;
    --layer-focus: #404040;
    --surface: #404040;
    --surface-hover: #525252;
    --muted: #262626;
    --muted-hover: #404040;
    --muted-foreground: #737373;
    --muted-foreground-1: #a3a3a3;
    --muted-foreground-2: #d4d4d4;
    --table-line: #404040;
    --primary: var(--primary-500);
    --primary-hover: var(--primary-600);
    --primary-focus: var(--primary-600);
    color-scheme: dark;
  }
  /* Lovin red as the primary: the brand switch a real implementation would flip in one place. */
  [data-accent="lovin"] {
    --primary-50: #fff1f2; --primary-100: #fce8eb; --primary-200: #f9c9cf; --primary-400: #ec5f6e; --primary-500: #e4162b;
    --primary-600: #e4162b; --primary-700: #b80f22; --primary-800: #930c1b;
  }
  .dark[data-accent="lovin"] { --primary: #f0435a; --primary-hover: #e4162b; --primary-focus: #e4162b; }
  html { background: var(--page); }
  body { font-family: "Inter", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
</style>
<script>
  window.MOCK = {
    key: 'mock1', label: 'Mock 1 · Preline UI', tagline: 'Tailwind CSS v4 + Preline components and theme tokens, on the real Lovin Admin structure.',
    other: { label: 'Mock 2 · HeroUI', url: 'https://mock2.brunopessoa.com/' }
  };
  try { if (localStorage.getItem('lm-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
</script>
